<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ANAGRAMMDAYS - Anagrammer</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Exo+2:wght@300;400&display=swap');
      
      :root {
        --neon-cyan: #00FFFF;
        --neon-magenta: #FF00FF;
        --neon-purple: #B084FF;
      }

      body {
        font-family: 'Exo 2', Arial, sans-serif;
        text-align: center;
        background: #050714;
        background-image: 
          radial-gradient(circle at 20% 50%, rgba(0, 255, 255, 0.1) 0%, transparent 50%),
          radial-gradient(circle at 80% 20%, rgba(255, 0, 255, 0.1) 0%, transparent 50%),
          url("images/scrabble_background.jpg");
        background-size: cover;
        background-attachment: fixed;
        background-blend-mode: overlay;
        color: #fff;
        overflow-x: hidden;
      }

      body::before {
        content: '';
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: linear-gradient(45deg, transparent 30%, rgba(0,255,255,0.03) 50%, transparent 70%);
        animation: scan 8s linear infinite;
        pointer-events: none;
        z-index: 1;
      }

      @keyframes scan {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(100%); }
      }

      #anagram-container {
        max-width: 600px;
        margin: 60px auto;
        padding: 30px;
        background: rgba(5, 7, 20, 0.85);
        backdrop-filter: blur(10px);
        border-radius: 15px;
        border: 2px solid var(--neon-cyan);
        box-shadow: 
          0 0 20px var(--neon-cyan),
          0 0 40px rgba(0, 255, 255, 0.3),
          inset 0 0 20px rgba(0, 255, 255, 0.1);
        position: relative;
        z-index: 2;
        animation: pulse 3s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { box-shadow: 0 0 20px var(--neon-cyan), 0 0 40px rgba(0, 255, 255, 0.3), inset 0 0 20px rgba(0, 255, 255, 0.1); }
        50% { box-shadow: 0 0 30px var(--neon-magenta), 0 0 60px rgba(255, 0, 255, 0.3), inset 0 0 30px rgba(255, 0, 255, 0.1); }
      }

      h1 {
        font-family: 'Orbitron', sans-serif;
        font-weight: 700;
        color: var(--neon-cyan);
        text-shadow: 
          0 0 5px var(--neon-cyan),
          0 0 10px var(--neon-cyan),
          0 0 20px var(--neon-cyan);
        margin-bottom: 25px;
        letter-spacing: 2px;
      }

      h2 {
        font-family: 'Orbitron', sans-serif;
        color: var(--neon-purple);
        text-shadow: 0 0 8px var(--neon-purple);
      }

      input {
        margin-top: 10px;
        padding: 12px;
        width: 80%;
        font-size: 16px;
        border-radius: 8px;
        border: 2px solid var(--neon-purple);
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        outline: none;
        transition: all 0.3s ease;
        box-shadow: 0 0 10px rgba(176, 132, 255, 0.3);
      }

      input:focus {
        border-color: var(--neon-cyan);
        box-shadow: 0 0 15px var(--neon-cyan), 0 0 30px rgba(0, 255, 255, 0.4);
      }

      button {
        margin-top: 15px;
        padding: 12px;
        width: 80%;
        font-size: 16px;
        border-radius: 8px;
        border: 2px solid var(--neon-magenta);
        background: linear-gradient(45deg, rgba(255,0,255,0.2), rgba(0,255,255,0.2));
        color: white;
        cursor: pointer;
        font-family: 'Orbitron', sans-serif;
        font-weight: 500;
        letter-spacing: 1px;
        transition: all 0.3s ease;
        box-shadow: 0 0 15px rgba(255, 0, 255, 0.4);
        text-transform: uppercase;
      }

      button:hover {
        background: linear-gradient(45deg, var(--neon-magenta), var(--neon-cyan));
        box-shadow: 0 0 25px var(--neon-magenta), 0 0 40px rgba(255, 0, 255, 0.6);
        transform: translateY(-2px);
      }

      .hidden {
        display: none;
      }

      #anagram-list {
        list-style: none;
        padding: 0;
      }

      #anagram-list li {
        padding: 8px;
        margin: 5px 0;
        background: rgba(0, 255, 255, 0.05);
        border-left: 3px solid var(--neon-cyan);
        color: var(--neon-cyan);
        text-shadow: 0 0 5px var(--neon-cyan);
        animation: fadeIn 0.5s ease;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateX(-10px); }
        to { opacity: 1; transform: translateX(0); }
      }

      footer {
        margin-top: 40px;
        color: var(--neon-purple);
        font-size: 14px;
        text-shadow: 0 0 5px var(--neon-purple);
        position: relative;
        z-index: 2;
      }
    </style>
  </head>
  <body>
    <!-- ajout de la navbar -->
    <div id="navbar-placeholder"></div>
    <script>
      fetch("navbar_connect.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("navbar-placeholder").innerHTML = data;
        });
    </script>
    <!-- fin de la navbar -->

    <div id="anagram-container">
      <h1>ANAGRAMMDAYS - Anagrammer</h1>
      <input id="word-input" type="text" placeholder="Entrez un mot" />
      <button onclick="generateAnagrams()">Générer des Anagrammes</button>
      <div id="anagram-results" class="hidden">
        <h2>Anagrammes trouvés :</h2>
        <ul id="anagram-list"></ul>
      </div>
    </div>

    <footer>
      <p>© 2024 ANAGRAMMDAYS</p>
      <p>
        Développé par:
        <br> Juste TOUGMA <br/>
      </p>
    </footer>

    <script>
      async function fetchAnagrams(word) {
        const response = await fetch(
          `https://api.dicolink.com/v1/mot/${word}/anagrammes?api_key=YOUR_API_KEY`
        );
        const data = await response.json();
        return data;
      }

      async function generateAnagrams() {
        const word = document.getElementById("word-input").value.toLowerCase();
        if (!word) {
          alert("Veuillez entrer un mot.");
          return;
        }
        const anagrams = await fetchAnagrams(word);
        const anagramList = document.getElementById("anagram-list");
        anagramList.innerHTML = "";
        if (anagrams.length === 0) {
          const listItem = document.createElement("li");
          listItem.textContent =
            "Aucun anagramme trouvé. Veuillez vérifier le mot.";
          anagramList.appendChild(listItem);
        } else {
          anagrams.forEach((anagram) => {
            const listItem = document.createElement("li");
            listItem.textContent = anagram;
            anagramList.appendChild(listItem);
          });
        }
        document.getElementById("anagram-results").classList.remove("hidden");
      }
    </script>
  </body>
</html>
